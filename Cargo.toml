[workspace]
resolver = "3"
members = ["crates/api"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
